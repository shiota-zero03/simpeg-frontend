server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA Fallback
  location / {
    try_files $uri /index.html;
  }

  # Optional: Static asset caching
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}