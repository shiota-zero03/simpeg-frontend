stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: "frontend-simpeg:latest"
  CONTAINER_NAME: "frontend-simpeg"
  PORT: "3001"

build:
  stage: build
  tags:
    - simpeg-frontend
  script:
    - echo "🚀 Building Docker Image"
    - docker build -t $DOCKER_IMAGE .

deploy:
  stage: deploy
  tags:
    - simpeg-frontend
  script:
    - echo "🚀 Stopping existing container"
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - echo "🚀 Running new container"
    - docker run -d -p $PORT:3001 --name $CONTAINER_NAME $DOCKER_IMAGE
  only:
    - develop

