version: "3.8"

services:
  react-app:
    image: ${CI_REGISTRY_IMAGE:-simpeg-frontend}:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api-simpeg.bekasikab.go.id/api/simpeg
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=local
      - VITE_API_URL=https://api-simpeg.bekasikab.go.id/api/simpeg
    env_file:
      - .env
    restart: unless-stopped
