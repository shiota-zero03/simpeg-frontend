stages:
  - build
  - deploy
  - build-production
  - deploy-production

variables:
  DOCKER_IMAGE: "frontend-simpeg:latest"
  CONTAINER_NAME: "frontend-simpeg"
  PORT: "3001"

build:
  stage: build
  tags:
    - simpeg-frontend
  script:
    - echo "🚀 Building Docker Image"
    - docker build -t $DOCKER_IMAGE .
  only:
    - develop

deploy:
  stage: deploy
  tags:
    - simpeg-frontend
  script:
    - echo "🚀 Stopping existing container"
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - echo "🚀 Running new container"
    - docker run -f docker-compose.dev.yml -d -p $PORT:3001 --name $CONTAINER_NAME $DOCKER_IMAGE
  only:
    - develop

    
# production 
build-production:
  stage: build
  tags:
    - frontend-production
  script:
    - echo "🚀 Building Docker Image"
    - docker build -t $DOCKER_IMAGE .
  only:
    - production

deploy-production:
  stage: deploy
  tags:
    - frontend-production
  script:
    - echo "🚀 Stopping existing container"
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - echo "🚀 Running new container"
    - docker run -f docker-compose.yml -d -p $PORT:3001 --name $CONTAINER_NAME $DOCKER_IMAGE
  only:
    - production
